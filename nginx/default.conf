limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=play_limit:10m rate=60r/m;

log_format mixstream_json escape=json
    '{"timestamp":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"range":"$http_range",'
    '"user_agent":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;
    client_max_body_size 3g;
    access_log /dev/stdout mixstream_json;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream app:8000;

    # Docker Desktop bind mounts on macOS can wedge static media responses when
    # sendfile is enabled. Linux/Unraid can safely override this if desired.
    sendfile off;
    tcp_nopush off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
    }

    location /media/covers/ {
        alias /media/covers/;
        access_log off;
        expires 30d;
    }

    location /media/profiles/ {
        alias /media/profiles/;
        access_log off;
        expires 30d;
    }

    location /media/mixes/ {
        return 404;
    }

    location /media/ {
        return 404;
    }

    location /protected-media/ {
        internal;
        alias /media/;
        add_header Accept-Ranges bytes;
    }

    location = /login/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://$app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /oidc/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://$app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /upload/ {
        limit_req zone=upload_limit burst=3 nodelay;
        proxy_pass http://$app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location ~ ^/mixes/[0-9]+/(play|stream-event|view)/$ {
        limit_req zone=play_limit burst=60 nodelay;
        proxy_pass http://$app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://$app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
