{% extends "mixes/base.html" %}
{% block title %}Public mixes · MixStream{% endblock %}
{% block content %}
<section class="section-head">
  <h2>Fresh public mixes</h2>
</section>
<div class="mix-list">
  {% for mix in mixes %}
    {% include "mixes/partials/mix_card.html" %}

  {% endfor %}
</div>
{% endblock %}
